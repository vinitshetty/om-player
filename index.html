<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Om's Learning Videos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee;overflow:hidden;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Desktop: video left, playlist right */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{background:#16213e;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f3460}
header h1{font-size:1.2em;color:#e94560}
header .info{font-size:.8em;color:#999}
.main{display:grid;grid-template-columns:1fr 340px;overflow:hidden}

/* Player area */
.player-area{display:flex;flex-direction:column;background:#000;position:relative;min-height:0;overflow:hidden}
.video-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;flex-shrink:0;overflow:hidden}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;pointer-events:none}
.vid-overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;cursor:pointer}

/* Controls bar */
.controls{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#16213e;flex-shrink:0}
.controls button{background:#0f3460;color:#fff;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .2s;flex-shrink:0}
.controls button:hover{background:#e94560}
.controls button.active{background:#e94560}
.controls button.text-btn{width:auto;border-radius:8px;padding:4px 10px;font-size:.75em}
.now-playing{flex:1;min-width:0;font-size:.8em;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 4px}
.time-info{font-size:.7em;color:#888;white-space:nowrap;flex-shrink:0}

/* Progress/Seek bar */
.progress-wrap{height:10px;background:#0f3460;cursor:pointer;flex-shrink:0;position:relative;padding:3px 0}
.progress-wrap:hover{height:14px}
.progress-wrap::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0}
.progress-bar{height:100%;background:#e94560;width:0%;border-radius:2px;transition:width .5s linear;pointer-events:none;position:relative}
.progress-bar::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.progress-wrap:hover .progress-bar::after{opacity:1}

/* Sidebar */
.sidebar{display:flex;flex-direction:column;background:#16213e;border-left:2px solid #0f3460;overflow:hidden}
.search-box{padding:8px 10px;border-bottom:1px solid #0f3460}
.search-box input{width:100%;padding:6px 10px;border-radius:6px;border:1px solid #0f3460;background:#1a1a2e;color:#eee;font-size:.85em;outline:none}
.search-box input:focus{border-color:#e94560}
.group-bar{padding:8px 10px;border-bottom:1px solid #0f3460}
.group-pills{display:flex;flex-wrap:wrap;gap:4px}
.group-pill{font-size:.75em;padding:4px 12px;border-radius:14px;border:1px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;transition:all .2s}
.group-pill:hover{border-color:#e94560;color:#fff}
.group-pill.active{background:#e94560;border-color:#e94560;color:#fff}
.count-bar{padding:5px 12px;font-size:.7em;color:#888;border-bottom:1px solid #0f3460;text-align:center}
.video-list{flex:1;overflow-y:auto;padding:4px 0}
.video-list::-webkit-scrollbar{width:6px}
.video-list::-webkit-scrollbar-thumb{background:#0f3460;border-radius:3px}
.vid-item{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;border-bottom:1px solid #0f3460;transition:background .15s}
.vid-item:hover{background:#0f3460}
.vid-item.playing{background:#e94560;color:#fff}
.vid-item .num{font-size:.7em;color:#666;min-width:22px;text-align:right}
.vid-item.playing .num{color:#fff}
.vid-item .meta{flex:1;overflow:hidden}
.vid-item .title{font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-item .cat{font-size:.6em;color:#888;margin-top:1px}
.vid-item.playing .cat{color:#fcc}
.vid-item .dur{font-size:.65em;color:#666;min-width:28px;text-align:right}
.vid-item.playing .dur{color:#fcc}

/* Fullscreen overlay controls */
.fs-controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2147483647;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border-radius:28px;padding:8px 16px;gap:10px;align-items:center;display:flex;opacity:0;pointer-events:none;transition:opacity .3s}
.fs-controls.visible{opacity:1;pointer-events:auto}
.fs-controls button{background:rgba(255,255,255,.15);color:#fff;border:none;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.fs-controls button:hover{background:rgba(255,255,255,.3)}
.fs-controls .fs-title{color:#fff;font-size:.8em;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Mobile toggle */
.mob-toggle{display:none!important}

/* ── Tablet layout (iPad portrait) ── */
@media(max-width:1024px){
  .main{grid-template-columns:1fr 280px}
}
/* ── Mobile layout ── */
@media(max-width:900px){
  .main{display:flex;flex-direction:column;overflow:hidden}
  .player-area{flex-shrink:0}
  .video-wrap{padding-top:56.25%}
  .controls{padding:6px 8px;gap:4px;flex-wrap:nowrap;overflow-x:auto}
  .controls button{width:32px;height:32px}
  .now-playing{font-size:.7em}
  .mob-toggle{display:flex!important}
  .sidebar{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#16213e;transform:translateY(100%);transition:transform .3s ease;border-left:none}
  .sidebar.open{transform:translateY(0)}
  .sidebar-close{display:block!important}
  header{padding:6px 12px}
  header h1{font-size:1em}
}
/* ── Small phones ── */
@media(max-width:380px){
  .controls button{width:28px;height:28px}
  .controls button svg{width:12px;height:12px}
  .controls{gap:2px;padding:4px 6px}
  .now-playing{display:none}
}
/* ── Mobile landscape ── */
@media(max-width:900px) and (orientation:landscape){
  header{display:none}
  .app{grid-template-rows:1fr}
  .player-area{flex:1;min-height:0}
  .video-wrap{padding-top:0;flex:1;min-height:0}
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%}
  .controls{padding:2px 8px;gap:3px}
  .controls button{width:28px;height:28px}
  .controls button svg{width:12px;height:12px}
  .now-playing{font-size:.65em}
}
/* ── Mobile fake fullscreen ── */
.mobile-fs .player-area{position:fixed!important;top:0;left:0;right:0;bottom:0;z-index:9999}
.mobile-fs header,.mobile-fs .sidebar{display:none!important}
.mobile-fs .video-wrap{padding-top:0;flex:1;min-height:0}
.mobile-fs .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%}
.mobile-fs .progress-wrap{position:absolute;bottom:44px;left:0;right:0;z-index:10001;opacity:0;transition:opacity .3s;pointer-events:none}
.mobile-fs .progress-wrap.show-controls{opacity:1;pointer-events:auto}
.mobile-fs .controls{position:absolute;bottom:0;left:0;right:0;background:rgba(22,33,62,.85);z-index:10001;opacity:0;transition:opacity .3s;pointer-events:none}
.mobile-fs .controls.show-controls{opacity:1;pointer-events:auto}
.fs-tap{display:none}
.mobile-fs .fs-tap{display:block;position:absolute;top:0;left:0;right:0;bottom:0;z-index:10000;cursor:pointer}
.sidebar-close{display:none;position:absolute;top:8px;right:10px;background:none;border:none;color:#e94560;font-size:1.5em;cursor:pointer;z-index:101}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Om's Learning Videos</h1>
    <span class="info" id="headerInfo"></span>
  </header>
  <div class="main">
    <div class="player-area">
      <div class="video-wrap" id="videoWrap">
        <div id="playerTarget"></div>
        <div class="vid-overlay" onclick="togglePlay()"></div>
      </div>
      <div class="fs-tap" id="fsTap" onclick="showMobileControls()"></div>
      <div class="progress-wrap" id="progressWrap" onclick="seekTo(event)">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="controls">
        <button onclick="playPrev()" title="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button onclick="skip(-10)" title="Back 10s"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="10" y="16" font-size="7" text-anchor="middle" fill="currentColor" font-weight="bold">10</text></svg></button>
        <button onclick="togglePlay()" id="playBtn" title="Play/Pause"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg></button>
        <button onclick="skip(10)" title="Forward 10s"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="14" y="16" font-size="7" text-anchor="middle" fill="currentColor" font-weight="bold">10</text></svg></button>
        <button onclick="playNext()" title="Next"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zm8.5 0h2V6h-2z"/></svg></button>
        <button onclick="shuffle()" id="shuffleBtn" title="Shuffle"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
        <button onclick="toggleAutoplay()" id="autoBtn" class="active text-btn" title="Auto-play">Auto</button>
        <button onclick="goFullscreen()" id="fsBtn" title="Fullscreen"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
        <button onclick="exitFullscreen()" id="exitFsBtn" style="display:none" title="Exit Fullscreen"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg></button>
        <button class="mob-toggle text-btn" onclick="toggleSidebar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg></button>
        <span class="time-info" id="timeInfo">0:00 / 0:00</span>
      </div>
      <div class="fs-controls" id="fsControls">
        <button onclick="playPrev()" title="Previous"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button onclick="togglePlay()" id="fsPlayBtn" title="Play/Pause"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg></button>
        <button onclick="playNext()" title="Next"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zm8.5 0h2V6h-2z"/></svg></button>
        <button onclick="shuffle()" id="fsShuffleBtn" title="Shuffle"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
        <span class="fs-title" id="fsTitle"></span>
        <button onclick="exitFullscreen()" title="Exit Fullscreen"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg></button>
      </div>
    </div>
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close" onclick="toggleSidebar()">&times;</button>
      <div class="search-box"><input type="text" id="searchInput" placeholder="Search videos..." oninput="filterList()"></div>
      <div class="group-bar">
        <div class="group-pills" id="groupPills"></div>
      </div>
      <div class="count-bar" id="countBar"></div>
      <div class="video-list" id="videoList"></div>
    </div>
  </div>
</div>

<script>
let VIDEOS=[];

fetch('videos.json').then(r=>r.json()).then(data=>{VIDEOS=data;init()}).catch(()=>{
  document.body.innerHTML='<div style="color:#e94560;text-align:center;padding:40px;font-size:1.3em">Failed to load videos.json</div>'
});

let playlist=[];
let loaded=false;
function init(){
  playlist=[...VIDEOS];
  loaded=true;
  initGroups();
  filterList();
  const tag=document.createElement('script');
  tag.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}

let currentIdx=0;
let autoplay=true;
let shuffled=false;
let player;
let activeGroup='';

function initGroups(){
  const groups=[...new Set(VIDEOS.map(v=>v.group||'Other'))];
  const el=document.getElementById('groupPills');
  const allPill=document.createElement('span');
  allPill.className='group-pill active';
  allPill.textContent='All';
  allPill.onclick=()=>{activeGroup='';el.querySelectorAll('.group-pill').forEach(p=>p.classList.remove('active'));allPill.classList.add('active');filterList()};
  el.appendChild(allPill);
  groups.forEach(g=>{
    const p=document.createElement('span');
    p.className='group-pill';
    p.textContent=g;
    p.onclick=()=>{
      activeGroup=activeGroup===g?'':g;
      el.querySelectorAll('.group-pill').forEach(x=>x.classList.remove('active'));
      if(activeGroup)p.classList.add('active');else allPill.classList.add('active');
      filterList()
    };
    el.appendChild(p)
  })
}

function filterList(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  playlist=VIDEOS.filter(v=>{
    if(activeGroup&&(v.group||'Other')!==activeGroup)return false;
    if(q&&!v.title.toLowerCase().includes(q)&&!v.cat.toLowerCase().includes(q)&&!(v.group||'').toLowerCase().includes(q))return false;
    return true
  });
  currentIdx=0;
  renderList();
  document.getElementById('countBar').textContent=playlist.length+' videos';
  document.getElementById('headerInfo').textContent=playlist.length+' of '+VIDEOS.length+' videos'
}

function renderList(){
  const el=document.getElementById('videoList');
  el.innerHTML='';
  playlist.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='vid-item'+(i===currentIdx?' playing':'');
    d.innerHTML=`<span class="num">${i+1}</span><div class="meta"><div class="title">${esc(v.title)}</div><div class="cat">${esc(v.cat)}</div></div><span class="dur">${v.dur}m</span>`;
    d.onclick=()=>playIndex(i);
    el.appendChild(d)
  })
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

const playIcon='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const pauseIcon='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>';
const playIconLg='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const pauseIconLg='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>';

function updatePlayIcons(playing){
  document.getElementById('playBtn').innerHTML=playing?pauseIcon:playIcon;
  document.getElementById('fsPlayBtn').innerHTML=playing?pauseIconLg:playIconLg;
}

function isMobile(){return window.innerWidth<=900}

function playIndex(i){
  if(i<0||i>=playlist.length)return;
  currentIdx=i;
  const v=playlist[i];
  player.loadVideoById(v.id);
  document.getElementById('nowPlaying').textContent=v.title;
  document.getElementById('fsTitle').textContent=v.title;
  renderList();
  document.querySelector('.vid-item.playing')?.scrollIntoView({block:'nearest'});
  if(isMobile())document.getElementById('sidebar').classList.remove('open')
}

function playNext(){if(currentIdx<playlist.length-1)playIndex(currentIdx+1);else playIndex(0)}
function playPrev(){if(currentIdx>0)playIndex(currentIdx-1);else playIndex(playlist.length-1)}

function togglePlay(){
  if(!player)return;
  const s=player.getPlayerState();
  if(s===1)player.pauseVideo();else player.playVideo()
}

function skip(sec){
  if(!player)return;
  player.seekTo(player.getCurrentTime()+sec,true);
}

function seekTo(e){
  if(!player)return;
  const bar=document.getElementById('progressWrap');
  const pct=e.offsetX/bar.offsetWidth;
  player.seekTo(pct*player.getDuration(),true);
}

function fmtTime(s){
  s=Math.floor(s);
  const m=Math.floor(s/60);
  const sec=s%60;
  return m+':'+(sec<10?'0':'')+sec;
}

let progressInterval;
function startProgress(){
  clearInterval(progressInterval);
  progressInterval=setInterval(()=>{
    if(!player||!player.getDuration)return;
    const cur=player.getCurrentTime();
    const dur=player.getDuration();
    if(dur>0){
      document.getElementById('progressBar').style.width=(cur/dur*100)+'%';
      document.getElementById('timeInfo').textContent=fmtTime(cur)+' / '+fmtTime(dur);
    }
  },500);
}

function toggleAutoplay(){
  autoplay=!autoplay;
  document.getElementById('autoBtn').classList.toggle('active',autoplay)
}

function shuffle(){
  shuffled=!shuffled;
  document.getElementById('shuffleBtn').classList.toggle('active',shuffled);
  document.getElementById('fsShuffleBtn')?.classList.toggle('active',shuffled);
  if(shuffled){
    const cur=playlist[currentIdx];
    for(let i=playlist.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[playlist[i],playlist[j]]=[playlist[j],playlist[i]]}
    currentIdx=playlist.indexOf(cur);
  }else{
    const cur=playlist[currentIdx];
    filterList();
    currentIdx=playlist.indexOf(cur);
    if(currentIdx<0)currentIdx=0;
  }
  renderList()
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

let mobileFs=false;
let mobileControlsTimeout;

function goFullscreen(){
  if(isMobile()){
    // CSS-based fullscreen for mobile
    mobileFs=true;
    document.querySelector('.app').classList.add('mobile-fs');
    const ctrl=document.querySelector('.controls');
    const prog=document.getElementById('progressWrap');
    ctrl.classList.add('show-controls');
    prog.classList.add('show-controls');
    clearTimeout(mobileControlsTimeout);
    mobileControlsTimeout=setTimeout(()=>{ctrl.classList.remove('show-controls');prog.classList.remove('show-controls')},3000);
    // Try to lock landscape
    try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
    document.getElementById('fsBtn').style.display='none';
    document.getElementById('exitFsBtn').style.display='';
    // Touch to show controls
    document.querySelector('.player-area').addEventListener('touchstart',showMobileControls);
    document.querySelector('.player-area').addEventListener('mousemove',showMobileControls);
    return;
  }
  const el=document.querySelector('.player-area');
  if(el.requestFullscreen)el.requestFullscreen();
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
}

function exitFullscreen(){
  if(mobileFs){
    mobileFs=false;
    document.querySelector('.app').classList.remove('mobile-fs');
    document.querySelector('.controls').classList.remove('show-controls');
    document.getElementById('progressWrap').classList.remove('show-controls');
    document.querySelector('.player-area').removeEventListener('touchstart',showMobileControls);
    document.querySelector('.player-area').removeEventListener('mousemove',showMobileControls);
    document.getElementById('fsBtn').style.display='';
    document.getElementById('exitFsBtn').style.display='none';
    try{screen.orientation.unlock()}catch(e){}
    return;
  }
  if(document.exitFullscreen)document.exitFullscreen();
  else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
}

function showMobileControls(e){
  if(e)e.stopPropagation();
  const ctrl=document.querySelector('.controls');
  const prog=document.getElementById('progressWrap');
  ctrl.classList.add('show-controls');
  prog.classList.add('show-controls');
  clearTimeout(mobileControlsTimeout);
  mobileControlsTimeout=setTimeout(()=>{ctrl.classList.remove('show-controls');prog.classList.remove('show-controls')},4000);
}

let fsTimeout;
function showFsControls(){
  const fc=document.getElementById('fsControls');
  fc.classList.add('visible');
  clearTimeout(fsTimeout);
  fsTimeout=setTimeout(()=>fc.classList.remove('visible'),3000);
}

function onFsChange(){
  const isFs=!!document.fullscreenElement||!!document.webkitFullscreenElement;
  const fc=document.getElementById('fsControls');
  if(isFs){
    showFsControls();
    document.querySelector('.player-area').addEventListener('mousemove',showFsControls);
    document.querySelector('.player-area').addEventListener('touchstart',showFsControls);
  }else{
    fc.classList.remove('visible');
    document.querySelector('.player-area').removeEventListener('mousemove',showFsControls);
    document.querySelector('.player-area').removeEventListener('touchstart',showFsControls);
  }
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);

function onYouTubeIframeAPIReady(){
  player=new YT.Player('playerTarget',{
    height:'100%',width:'100%',
    videoId:playlist[0].id,
    host:'https://www.youtube-nocookie.com',
    playerVars:{
      autoplay:1,rel:0,modestbranding:1,fs:0,
      disablekb:0,iv_load_policy:3,playsinline:1,
      origin:location.origin
    },
    events:{
      onReady:()=>{document.getElementById('nowPlaying').textContent=playlist[0].title;document.getElementById('fsTitle').textContent=playlist[0].title;startProgress()},
      onStateChange:(e)=>{
        if(e.data===YT.PlayerState.ENDED){updatePlayIcons(false);if(autoplay)playNext()}
        else if(e.data===YT.PlayerState.PLAYING)updatePlayIcons(true);
        else if(e.data===YT.PlayerState.PAUSED)updatePlayIcons(false)
      }
    }
  })
}

if(loaded){initGroups();filterList()}
