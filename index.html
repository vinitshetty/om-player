<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Om's Math Videos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee;overflow:hidden;height:100vh}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{background:#16213e;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #0f3460}
header h1{font-size:1.4em;color:#e94560}
header .info{font-size:.85em;color:#999}
.main{display:grid;grid-template-columns:1fr 360px;overflow:hidden}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#16213e}.mob-toggle{display:block!important}}
.player-area{display:flex;flex-direction:column;background:#000}
.video-wrap{position:relative;width:100%;padding-top:56.25%;background:#000}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.yt-block-top{position:absolute;top:0;left:0;right:0;height:42px;z-index:10;cursor:default}
.yt-block-bot{position:absolute;bottom:0;left:0;width:120px;height:36px;z-index:10;cursor:default}
.controls{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#16213e;flex-wrap:wrap}
.controls button{background:#0f3460;color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:.95em;transition:background .2s}
.controls button:hover{background:#e94560}
.controls button.active{background:#e94560}
.now-playing{flex:1;min-width:200px;font-size:.9em;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mob-toggle{display:none;background:#e94560!important;font-size:1.1em!important}
.sidebar{display:flex;flex-direction:column;background:#16213e;border-left:2px solid #0f3460;overflow:hidden}
.cat-bar{padding:10px;border-bottom:1px solid #0f3460;max-height:200px;overflow-y:auto}
.cat-bar h3{font-size:.8em;color:#e94560;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.cat-pills{display:flex;flex-wrap:wrap;gap:4px}
.cat-pill{font-size:.7em;padding:3px 8px;border-radius:12px;border:1px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;transition:all .2s}
.cat-pill:hover{border-color:#e94560;color:#fff}
.cat-pill.active{background:#e94560;border-color:#e94560;color:#fff}
.video-list{flex:1;overflow-y:auto;padding:4px 0}
.video-list::-webkit-scrollbar{width:6px}
.video-list::-webkit-scrollbar-thumb{background:#0f3460;border-radius:3px}
.vid-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #0f3460;transition:background .15s}
.vid-item:hover{background:#0f3460}
.vid-item.playing{background:#e94560;color:#fff}
.vid-item .num{font-size:.75em;color:#666;min-width:24px;text-align:right}
.vid-item.playing .num{color:#fff}
.vid-item .meta{flex:1;overflow:hidden}
.vid-item .title{font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-item .cat{font-size:.65em;color:#888;margin-top:2px}
.vid-item.playing .cat{color:#fcc}
.vid-item .dur{font-size:.7em;color:#666;min-width:32px;text-align:right}
.vid-item.playing .dur{color:#fcc}
.search-box{padding:8px 10px;border-bottom:1px solid #0f3460}
.search-box input{width:100%;padding:6px 10px;border-radius:6px;border:1px solid #0f3460;background:#1a1a2e;color:#eee;font-size:.85em;outline:none}
.search-box input:focus{border-color:#e94560}
.count-bar{padding:6px 12px;font-size:.7em;color:#888;border-bottom:1px solid #0f3460;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Om's Learning Videos</h1>
    <span class="info" id="headerInfo">335 videos</span>
  </header>
  <div class="main">
    <div class="player-area">
      <div class="video-wrap" id="videoWrap">
        <div class="yt-block-top"></div>
        <div id="playerTarget"></div>
        <div class="yt-block-bot"></div>
      </div>
      <div class="controls">
        <button onclick="playPrev()">Prev</button>
        <button onclick="togglePlay()" id="playBtn">Pause</button>
        <button onclick="playNext()">Next</button>
        <button onclick="shuffle()" id="shuffleBtn">Shuffle</button>
        <button onclick="toggleAutoplay()" id="autoBtn" class="active">Auto-play ON</button>
        <button class="mob-toggle" onclick="toggleSidebar()">Playlist</button>
        <div class="now-playing" id="nowPlaying"></div>
      </div>
    </div>
    <div class="sidebar" id="sidebar">
      <div class="search-box"><input type="text" id="searchInput" placeholder="Filter videos..." oninput="filterList()"></div>
      <div class="cat-bar">
        <h3>Subject</h3>
        <div class="cat-pills" id="groupPills"></div>
        <h3 style="margin-top:8px">Category</h3>
        <div class="cat-pills" id="catPills"></div>
      </div>
      <div class="count-bar" id="countBar">335 videos</div>
      <div class="video-list" id="videoList"></div>
    </div>
  </div>
</div>

<script>
let VIDEOS=[];

fetch('videos.json').then(r=>r.json()).then(data=>{VIDEOS=data;init()}).catch(()=>{
  document.body.innerHTML='<div style="color:#e94560;text-align:center;padding:40px;font-size:1.3em">Failed to load videos.json</div>'
});

let playlist=[];
let loaded=false;
function init(){
  playlist=[...VIDEOS];
  loaded=true;
  initCats();
  filterList();
  const tag=document.createElement('script');
  tag.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}
let currentIdx=0;
let autoplay=true;
let shuffled=false;
let player;
let activeGroup='';
let activeCats=new Set();

function initCats(){
  const groups=[...new Set(VIDEOS.map(v=>v.group||'Other'))];
  const gEl=document.getElementById('groupPills');
  const allG=document.createElement('span');
  allG.className='cat-pill active';
  allG.textContent='All';
  allG.onclick=()=>{activeGroup='';gEl.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));allG.classList.add('active');activeCats.clear();rebuildCatPills();filterList()};
  gEl.appendChild(allG);
  groups.forEach(g=>{
    const p=document.createElement('span');
    p.className='cat-pill';
    p.textContent=g;
    p.onclick=()=>{
      activeGroup=activeGroup===g?'':g;
      gEl.querySelectorAll('.cat-pill').forEach(x=>x.classList.remove('active'));
      if(activeGroup)p.classList.add('active');else allG.classList.add('active');
      activeCats.clear();
      rebuildCatPills();
      filterList()
    };
    gEl.appendChild(p)
  });
  rebuildCatPills()
}

function rebuildCatPills(){
  const el=document.getElementById('catPills');
  el.innerHTML='';
  const filtered=activeGroup?VIDEOS.filter(v=>(v.group||'Other')===activeGroup):VIDEOS;
  const cats=[...new Set(filtered.map(v=>v.cat))];
  const allPill=document.createElement('span');
  allPill.className='cat-pill active';
  allPill.textContent='All';
  allPill.onclick=()=>{activeCats.clear();el.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));allPill.classList.add('active');filterList()};
  el.appendChild(allPill);
  cats.forEach(c=>{
    const p=document.createElement('span');
    p.className='cat-pill';
    p.textContent=c;
    p.onclick=()=>{
      allPill.classList.remove('active');
      if(activeCats.has(c)){activeCats.delete(c);p.classList.remove('active')}
      else{activeCats.add(c);p.classList.add('active')}
      if(!activeCats.size)allPill.classList.add('active');
      filterList()
    };
    el.appendChild(p)
  })
}

function filterList(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  playlist=VIDEOS.filter(v=>{
    if(activeGroup&&(v.group||'Other')!==activeGroup)return false;
    if(activeCats.size&&!activeCats.has(v.cat))return false;
    if(q&&!v.title.toLowerCase().includes(q)&&!v.cat.toLowerCase().includes(q))return false;
    return true
  });
  currentIdx=0;
  renderList();
  document.getElementById('countBar').textContent=playlist.length+' videos';
  document.getElementById('headerInfo').textContent=playlist.length+' of '+VIDEOS.length+' videos'
}

function renderList(){
  const el=document.getElementById('videoList');
  el.innerHTML='';
  playlist.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='vid-item'+(i===currentIdx?' playing':'');
    d.innerHTML=`<span class="num">${i+1}</span><div class="meta"><div class="title">${esc(v.title)}</div><div class="cat">${esc(v.cat)}</div></div><span class="dur">${v.dur}m</span>`;
    d.onclick=()=>playIndex(i);
    el.appendChild(d)
  })
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function playIndex(i){
  if(i<0||i>=playlist.length)return;
  currentIdx=i;
  const v=playlist[i];
  player.loadVideoById(v.id);
  document.getElementById('nowPlaying').textContent=v.title;
  renderList();
  document.querySelector('.vid-item.playing')?.scrollIntoView({block:'nearest'})
}

function playNext(){if(currentIdx<playlist.length-1)playIndex(currentIdx+1);else playIndex(0)}
function playPrev(){if(currentIdx>0)playIndex(currentIdx-1);else playIndex(playlist.length-1)}

function togglePlay(){
  if(!player)return;
  const s=player.getPlayerState();
  if(s===1)player.pauseVideo();else player.playVideo()
}

function toggleAutoplay(){
  autoplay=!autoplay;
  const b=document.getElementById('autoBtn');
  b.textContent=autoplay?'Auto-play ON':'Auto-play OFF';
  b.classList.toggle('active',autoplay)
}

function shuffle(){
  shuffled=!shuffled;
  document.getElementById('shuffleBtn').classList.toggle('active',shuffled);
  if(shuffled){
    const cur=playlist[currentIdx];
    for(let i=playlist.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[playlist[i],playlist[j]]=[playlist[j],playlist[i]]}
    currentIdx=playlist.indexOf(cur);
  }else{
    const cur=playlist[currentIdx];
    filterList();
    currentIdx=playlist.indexOf(cur);
    if(currentIdx<0)currentIdx=0;
  }
  renderList()
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

function onYouTubeIframeAPIReady(){
  player=new YT.Player('playerTarget',{
    height:'100%',width:'100%',
    videoId:playlist[0].id,
    host:'https://www.youtube-nocookie.com',
    playerVars:{
      autoplay:1,rel:0,modestbranding:1,fs:1,
      disablekb:0,iv_load_policy:3,
      origin:location.origin
    },
    events:{
      onReady:()=>{document.getElementById('nowPlaying').textContent=playlist[0].title},
      onStateChange:(e)=>{
        const b=document.getElementById('playBtn');
        if(e.data===YT.PlayerState.ENDED){b.textContent='Play';if(autoplay)playNext()}
        else if(e.data===YT.PlayerState.PLAYING)b.textContent='Pause';
        else if(e.data===YT.PlayerState.PAUSED)b.textContent='Play'
      }
    }
  })
}

if(loaded){initCats();filterList()}
</script>
</body>
</html>
