<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Om's Learning Videos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee;overflow:hidden;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.bars-hidden .app{grid-template-rows:0 1fr}
header{background:#16213e;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f3460;transition:transform .3s,opacity .3s}
.bars-hidden header{transform:translateY(-100%);opacity:0;pointer-events:none;position:absolute;top:0;left:0;right:0;z-index:10}
header h1{font-size:1.2em;color:#e94560}
header .browse-btn{font-size:.8em;color:#fff;background:#e94560;border:none;padding:6px 14px;border-radius:16px;cursor:pointer;transition:background .2s}
header .browse-btn:hover{background:#c73652}
.main{display:grid;grid-template-columns:1fr;overflow:hidden}

/* Player area */
.player-area{display:flex;flex-direction:column;background:#000;position:relative;min-height:0;overflow:hidden}
.video-wrap{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}

/* Controls bar */
.controls{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#16213e;flex-shrink:0;transition:transform .3s,opacity .3s}
.bars-hidden .controls{transform:translateY(100%);opacity:0;pointer-events:none}
.controls button{background:#0f3460;color:#fff;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .2s;flex-shrink:0}
.controls button svg{width:20px;height:20px}
.controls button:hover{background:#e94560}
.controls button.active{background:#e94560}
.controls button.text-btn{width:auto;border-radius:8px;padding:6px 14px;font-size:.85em}
.now-playing{flex:1;min-width:0;font-size:.8em;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 4px}

/* ── Browse overlay (Netflix-style) ── */
.browse{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#1a1a2e;transform:translateY(100%);transition:transform .3s ease;display:flex;flex-direction:column;overflow:hidden}
.browse.open{transform:translateY(0)}
.browse-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#16213e;border-bottom:2px solid #0f3460;flex-shrink:0}
.browse-header h2{font-size:1.1em;color:#e94560;white-space:nowrap}
.browse-search{flex:1;padding:8px 14px;border-radius:20px;border:2px solid #0f3460;background:#1a1a2e;color:#eee;font-size:.95em;outline:none;min-width:0}
.browse-search:focus{border-color:#e94560}
.browse-close{background:none;border:none;color:#e94560;font-size:1.8em;cursor:pointer;padding:0 4px;line-height:1}
.browse-groups{padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #0f3460;flex-shrink:0}
.browse-pill{font-size:.8em;padding:6px 16px;border-radius:18px;border:1.5px solid #0f3460;background:transparent;color:#aaa;cursor:pointer;transition:all .2s}
.browse-pill:hover{border-color:#e94560;color:#fff}
.browse-pill.active{background:#e94560;border-color:#e94560;color:#fff}
.browse-count{padding:6px 16px;font-size:.75em;color:#888;flex-shrink:0}
.browse-rows{flex:1;overflow-y:auto;padding:8px 0}
.browse-rows::-webkit-scrollbar{width:6px}
.browse-rows::-webkit-scrollbar-thumb{background:#0f3460;border-radius:3px}

/* Category row */
.cat-row{margin-bottom:20px}
.cat-row-title{font-size:.9em;font-weight:600;color:#e94560;padding:0 16px 8px;display:flex;align-items:center;gap:8px}
.cat-row-count{font-size:.7em;color:#666;font-weight:400}
.cat-row-scroll{display:flex;flex-wrap:nowrap;gap:12px;overflow-x:auto;padding:0 16px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.cat-row-scroll::-webkit-scrollbar{height:4px}
.cat-row-scroll::-webkit-scrollbar-thumb{background:#0f3460;border-radius:2px}

/* Video card */
.vcard{flex:0 0 220px;min-width:220px;border-radius:10px;overflow:hidden;cursor:pointer;background:#16213e;transition:transform .2s,box-shadow .2s;scroll-snap-align:start}
.vcard:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(0,0,0,.5)}
.vcard.playing{outline:3px solid #e94560;outline-offset:-3px}
.vcard-thumb{position:relative;width:220px;height:124px;background:#0f3460;overflow:hidden}
.vcard-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vcard-dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.7em;padding:2px 6px;border-radius:4px}
.vcard-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;background:rgba(233,69,96,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.vcard:hover .vcard-play{opacity:1}
@media(pointer:coarse){.vcard-play{opacity:.7}}
.vcard-info{padding:8px 10px}
.vcard-title{font-size:.78em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard-cat{font-size:.65em;color:#888;margin-top:3px}
.vcard.playing .vcard-cat{color:#fcc}

/* Fullscreen overlay controls */
.fs-controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2147483647;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border-radius:28px;padding:8px 16px;gap:10px;align-items:center;display:flex;opacity:0;pointer-events:none;transition:opacity .3s}
.fs-controls.visible{opacity:1;pointer-events:auto}
.fs-controls button{background:rgba(255,255,255,.15);color:#fff;border:none;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.fs-controls button:hover{background:rgba(255,255,255,.3)}
.fs-controls .fs-title{color:#fff;font-size:.8em;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Responsive ── */
@media(max-width:1200px){
  .controls{padding:6px 8px;gap:4px;flex-wrap:nowrap;overflow-x:auto}
  .controls button{width:32px;height:32px}
  .now-playing{font-size:.7em}
  header{padding:6px 12px}
  header h1{font-size:1em}
}
@media(max-width:600px){
  .browse-header{padding:10px 12px;gap:8px}
  .browse-header h2{display:none}
  .browse-groups{padding:8px 12px;gap:5px}
  .browse-pill{font-size:.75em;padding:5px 12px}
  .vcard{flex:0 0 160px;min-width:160px}
  .vcard-thumb{width:160px;height:90px}
  .cat-row-scroll{gap:8px;padding:0 12px 6px}
  .cat-row-title{padding:0 12px 6px;font-size:.85em}
}
@media(max-width:380px){
  .controls button{width:28px;height:28px}
  .controls button svg{width:12px;height:12px}
  .controls{gap:2px;padding:4px 6px}
  .now-playing{display:none}
  .vcard{flex:0 0 140px;min-width:140px}
  .vcard-thumb{width:140px;height:79px}
}
/* ── Landscape ── */
@media(max-width:1200px) and (orientation:landscape){
  .player-area{flex:1;min-height:0}
  .controls{padding:2px 8px;gap:3px}
  .controls button{width:28px;height:28px}
  .controls button svg{width:12px;height:12px}
  .now-playing{font-size:.65em}
}
/* ── Mobile fake fullscreen ── */
.mobile-fs .player-area{position:fixed!important;top:0;left:0;right:0;bottom:0;z-index:9999}
.mobile-fs header{display:none!important}
.mobile-fs .browse{display:none!important}
.mobile-fs .browse.open{display:flex!important;z-index:10002}
.mobile-fs .controls{position:absolute;bottom:0;left:0;right:0;background:rgba(22,33,62,.85);z-index:10001;opacity:0;transition:opacity .3s;pointer-events:none}
.mobile-fs .controls.show-controls{opacity:1;pointer-events:auto}
.bars-tap{display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;cursor:pointer}
.bars-hidden .bars-tap{display:block}
.fs-tap{display:none}
.mobile-fs .fs-tap{display:block;position:absolute;top:0;left:0;right:0;bottom:50px;z-index:10000;cursor:pointer}
.watch-time{position:fixed;bottom:12px;right:12px;background:rgba(22,33,62,.85);backdrop-filter:blur(6px);color:#ccc;font-size:.75em;padding:5px 12px;border-radius:12px;z-index:50;pointer-events:none}
.watch-time span{color:#e94560;font-weight:600}
.mobile-fs .watch-time{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Om's Learning Videos</h1>
    <button class="browse-btn" id="headerInfo" onclick="toggleBrowse()"></button>
  </header>
  <div class="main">
    <div class="player-area">
      <div class="video-wrap" id="videoWrap">
        <div id="playerTarget"></div>
      </div>
      <div class="bars-tap" onclick="showBars()"></div>
      <div class="fs-tap" id="fsTap" onclick="showMobileControls()"></div>
      <div class="controls">
        <button onclick="playPrev()" title="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button onclick="togglePlay()" id="playBtn" title="Play/Pause"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg></button>
        <button onclick="playNext()" title="Next"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zm8.5 0h2V6h-2z"/></svg></button>
        <button onclick="shuffle()" id="shuffleBtn" title="Shuffle"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
        <button onclick="toggleAutoplay()" id="autoBtn" class="active text-btn" title="Auto-play">Auto</button>
        <button onclick="goFullscreen()" id="fsBtn" title="Fullscreen"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
        <button onclick="exitFullscreen()" id="exitFsBtn" style="display:none" title="Exit Fullscreen"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg></button>
        <button onclick="toggleBrowse()" id="browseBtn" title="Browse Videos"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></button>
        <div class="now-playing" id="nowPlaying"></div>
      </div>
      <div class="fs-controls" id="fsControls">
        <button onclick="playPrev()" title="Previous"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button onclick="togglePlay()" id="fsPlayBtn" title="Play/Pause"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg></button>
        <button onclick="playNext()" title="Next"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zm8.5 0h2V6h-2z"/></svg></button>
        <button onclick="shuffle()" id="fsShuffleBtn" title="Shuffle"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
        <span class="fs-title" id="fsTitle"></span>
        <button onclick="exitFullscreen()" title="Exit Fullscreen"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg></button>
      </div>
    </div>
  </div>
</div>
<div class="watch-time" id="watchTime">Today: <span id="watchVal">0m</span></div>

<!-- Browse overlay -->
<div class="browse" id="browse">
  <div class="browse-header">
    <h2>Browse</h2>
    <input type="text" class="browse-search" id="searchInput" placeholder="Search videos..." oninput="filterList()">
    <button class="browse-close" onclick="toggleBrowse()">&times;</button>
  </div>
  <div class="browse-groups" id="groupPills"></div>
  <div class="browse-count" id="countBar"></div>
  <div class="browse-rows" id="videoRows"></div>
</div>

<script>
const CACHE_KEY='om_videos_cache';
const CACHE_TTL=24*60*60*1000; // 24 hours

let VIDEOS=[];
let playlist=[];
let loaded=false;
let currentIdx=0;
let autoplay=true;
let shuffled=false;
let player;
let activeGroup='';

function loadVideos(){
  // Try cache first for instant load
  try{
    const cached=JSON.parse(localStorage.getItem(CACHE_KEY));
    if(cached&&cached.data&&(Date.now()-cached.ts)<CACHE_TTL){
      VIDEOS=cached.data;
      init();
      // Background refresh
      fetchFresh(false);
      return;
    }
  }catch(e){}
  fetchFresh(true);
}

function fetchFresh(required){
  fetch('videos.json').then(r=>r.json()).then(data=>{
    const changed=JSON.stringify(data)!==JSON.stringify(VIDEOS);
    localStorage.setItem(CACHE_KEY,JSON.stringify({data,ts:Date.now()}));
    if(changed){
      VIDEOS=data;
      if(loaded){
        const curId=playlist[currentIdx]?.id;
        initGroups();
        filterList();
        if(curId){const idx=playlist.findIndex(v=>v.id===curId);if(idx>=0)currentIdx=idx}
        renderGrid();
      }else{
        init();
      }
    }
  }).catch(()=>{
    if(required)document.body.innerHTML='<div style="color:#e94560;text-align:center;padding:40px;font-size:1.3em">Failed to load videos</div>';
  });
}

loadVideos();

let firstVisit=true;

function init(){
  playlist=[...VIDEOS];
  loaded=true;
  currentIdx=Math.floor(Math.random()*playlist.length);
  initGroups();
  filterList(true);
  const tag=document.createElement('script');
  tag.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  // Show browse on first load
  document.getElementById('browse').classList.add('open');
}

function thumb(id){return 'https://img.youtube.com/vi/'+id+'/mqdefault.jpg'}

function initGroups(){
  const groups=[...new Set(VIDEOS.map(v=>v.group||'Other'))];
  const el=document.getElementById('groupPills');
  el.innerHTML='';
  const allPill=document.createElement('span');
  allPill.className='browse-pill active';
  allPill.textContent='All';
  allPill.onclick=()=>{activeGroup='';el.querySelectorAll('.browse-pill').forEach(p=>p.classList.remove('active'));allPill.classList.add('active');filterList()};
  el.appendChild(allPill);
  groups.forEach(g=>{
    const p=document.createElement('span');
    p.className='browse-pill';
    p.textContent=g;
    p.onclick=()=>{
      activeGroup=activeGroup===g?'':g;
      el.querySelectorAll('.browse-pill').forEach(x=>x.classList.remove('active'));
      if(activeGroup)p.classList.add('active');else allPill.classList.add('active');
      filterList()
    };
    el.appendChild(p)
  })
}

function filterList(keepIdx){
  const q=document.getElementById('searchInput').value.toLowerCase();
  playlist=VIDEOS.filter(v=>{
    if(activeGroup&&(v.group||'Other')!==activeGroup)return false;
    if(q&&!v.title.toLowerCase().includes(q)&&!v.cat.toLowerCase().includes(q)&&!(v.group||'').toLowerCase().includes(q))return false;
    return true
  });
  if(!keepIdx)currentIdx=0;
  renderGrid();
  document.getElementById('countBar').textContent=playlist.length+' of '+VIDEOS.length+' videos';
  document.getElementById('headerInfo').textContent='Browse '+VIDEOS.length+' videos'
}

function renderGrid(){
  const el=document.getElementById('videoRows');
  el.innerHTML='';
  // Group by category, preserving playlist order
  const cats=[];
  const catMap={};
  playlist.forEach((v,i)=>{
    const c=v.cat||'Other';
    if(!catMap[c]){catMap[c]=[];cats.push(c)}
    catMap[c].push({v,i})
  });
  cats.forEach(cat=>{
    const row=document.createElement('div');
    row.className='cat-row';
    const items=catMap[cat];
    row.innerHTML=`<div class="cat-row-title">${esc(cat)}<span class="cat-row-count">(${items.length})</span></div>`;
    const scroll=document.createElement('div');
    scroll.className='cat-row-scroll';
    items.forEach(({v,i})=>{
      const card=document.createElement('div');
      card.className='vcard'+(i===currentIdx?' playing':'');
      card.innerHTML=`<div class="vcard-thumb"><img src="${thumb(v.id)}" alt="" loading="lazy"><span class="vcard-dur">${v.dur}m</span><div class="vcard-play"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div></div><div class="vcard-info"><div class="vcard-title">${esc(v.title)}</div></div>`;
      card.onclick=()=>playIndex(i);
      scroll.appendChild(card)
    });
    row.appendChild(scroll);
    el.appendChild(row)
  })
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

const playIcon='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const pauseIcon='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>';
const playIconLg='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const pauseIconLg='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>';

function updatePlayIcons(playing){
  document.getElementById('playBtn').innerHTML=playing?pauseIcon:playIcon;
  document.getElementById('fsPlayBtn').innerHTML=playing?pauseIconLg:playIconLg;
}

function isMobile(){return window.innerWidth<=1200}

function playIndex(i){
  if(i<0||i>=playlist.length)return;
  currentIdx=i;
  const v=playlist[i];
  player.loadVideoById(v.id);
  document.getElementById('nowPlaying').textContent=v.title;
  document.getElementById('fsTitle').textContent=v.title;
  renderGrid();
  document.getElementById('browse').classList.remove('open');
}

function playNext(){if(currentIdx<playlist.length-1)playIndex(currentIdx+1);else playIndex(0)}
function playPrev(){if(currentIdx>0)playIndex(currentIdx-1);else playIndex(playlist.length-1)}

function togglePlay(){
  if(!player)return;
  const s=player.getPlayerState();
  if(s===1)player.pauseVideo();else player.playVideo()
}

function toggleAutoplay(){
  autoplay=!autoplay;
  document.getElementById('autoBtn').classList.toggle('active',autoplay)
}

function shuffle(){
  shuffled=!shuffled;
  document.getElementById('shuffleBtn').classList.toggle('active',shuffled);
  document.getElementById('fsShuffleBtn')?.classList.toggle('active',shuffled);
  if(shuffled){
    const cur=playlist[currentIdx];
    for(let i=playlist.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[playlist[i],playlist[j]]=[playlist[j],playlist[i]]}
    currentIdx=playlist.indexOf(cur);
  }else{
    const cur=playlist[currentIdx];
    filterList();
    currentIdx=playlist.indexOf(cur);
    if(currentIdx<0)currentIdx=0;
  }
  renderGrid()
}

function toggleBrowse(){document.getElementById('browse').classList.toggle('open');showBars()}

let mobileFs=false;
let mobileControlsTimeout;

function goFullscreen(){
  if(isMobile()){
    mobileFs=true;
    document.querySelector('.app').classList.add('mobile-fs');
    const ctrl=document.querySelector('.controls');
    ctrl.classList.add('show-controls');
    clearTimeout(mobileControlsTimeout);
    mobileControlsTimeout=setTimeout(()=>ctrl.classList.remove('show-controls'),3000);
    try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
    document.getElementById('fsBtn').style.display='none';
    document.getElementById('exitFsBtn').style.display='';
    document.querySelector('.player-area').addEventListener('touchstart',showMobileControls);
    document.querySelector('.player-area').addEventListener('mousemove',showMobileControls);
    return;
  }
  const el=document.querySelector('.player-area');
  if(el.requestFullscreen)el.requestFullscreen();
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
}

function exitFullscreen(){
  if(mobileFs){
    mobileFs=false;
    document.querySelector('.app').classList.remove('mobile-fs');
    document.querySelector('.controls').classList.remove('show-controls');
    document.querySelector('.player-area').removeEventListener('touchstart',showMobileControls);
    document.querySelector('.player-area').removeEventListener('mousemove',showMobileControls);
    document.getElementById('fsBtn').style.display='';
    document.getElementById('exitFsBtn').style.display='none';
    try{screen.orientation.unlock()}catch(e){}
    return;
  }
  if(document.exitFullscreen)document.exitFullscreen();
  else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
}

function showMobileControls(e){
  if(e)e.stopPropagation();
  const ctrl=document.querySelector('.controls');
  ctrl.classList.add('show-controls');
  clearTimeout(mobileControlsTimeout);
  mobileControlsTimeout=setTimeout(()=>ctrl.classList.remove('show-controls'),6000);
}

let fsTimeout;
function showFsControls(){
  const fc=document.getElementById('fsControls');
  fc.classList.add('visible');
  clearTimeout(fsTimeout);
  fsTimeout=setTimeout(()=>fc.classList.remove('visible'),3000);
}

function onFsChange(){
  const isFs=!!document.fullscreenElement||!!document.webkitFullscreenElement;
  const fc=document.getElementById('fsControls');
  document.getElementById('fsBtn').style.display=isFs?'none':'';
  document.getElementById('exitFsBtn').style.display=isFs?'':'none';
  if(isFs){
    showFsControls();
    document.querySelector('.player-area').addEventListener('mousemove',showFsControls);
    document.querySelector('.player-area').addEventListener('touchstart',showFsControls);
  }else{
    fc.classList.remove('visible');
    document.querySelector('.player-area').removeEventListener('mousemove',showFsControls);
    document.querySelector('.player-area').removeEventListener('touchstart',showFsControls);
  }
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);

// Block any new tabs/windows from opening
window.open=function(){return null};

// Watch for iframe creation and sandbox it immediately
new MutationObserver((mutations)=>{
  for(const m of mutations)for(const node of m.addedNodes){
    if(node.tagName==='IFRAME'){
      node.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation');
    }
  }
}).observe(document.getElementById('videoWrap'),{childList:true,subtree:true});

function onYouTubeIframeAPIReady(){
  player=new YT.Player('playerTarget',{
    height:'100%',width:'100%',
    videoId:playlist[currentIdx].id,
    host:'https://www.youtube-nocookie.com',
    playerVars:{
      autoplay:0,rel:0,modestbranding:1,fs:0,
      disablekb:0,iv_load_policy:3,playsinline:1,
      origin:location.origin
    },
    events:{
      onReady:()=>{
        document.getElementById('nowPlaying').textContent=playlist[currentIdx].title;
        document.getElementById('fsTitle').textContent=playlist[currentIdx].title;
      },
      onStateChange:(e)=>{
        if(e.data===YT.PlayerState.ENDED){updatePlayIcons(false);stopWatchTimer();if(autoplay)playNext()}
        else if(e.data===YT.PlayerState.PLAYING){updatePlayIcons(true);startWatchTimer();startBarsAutoHide()}
        else if(e.data===YT.PlayerState.PAUSED){updatePlayIcons(false);stopWatchTimer()}
      }
    }
  })
}

// ── Watch time tracking ──
const WT_KEY='om_watch_time';
let wtInterval=null;

function todayKey(){return new Date().toISOString().slice(0,10)}

function getWatchSecs(){
  try{const d=JSON.parse(localStorage.getItem(WT_KEY)||'{}');return d[todayKey()]||0}catch(e){return 0}
}

function saveWatchSecs(s){
  try{const d=JSON.parse(localStorage.getItem(WT_KEY)||'{}');d[todayKey()]=s;localStorage.setItem(WT_KEY,JSON.stringify(d))}catch(e){}
}

function fmtWatch(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h>0?h+'h '+m+'m':m+'m';
}

function updateWatchDisplay(){
  document.getElementById('watchVal').textContent=fmtWatch(getWatchSecs());
}

function startWatchTimer(){
  if(wtInterval)return;
  wtInterval=setInterval(()=>{saveWatchSecs(getWatchSecs()+1);updateWatchDisplay()},1000);
}

function stopWatchTimer(){
  if(wtInterval){clearInterval(wtInterval);wtInterval=null}
}

updateWatchDisplay();

// ── Auto-hide header + controls bars ──
let barsTimeout=null;
let barsActive=false;

function showBars(){
  document.body.classList.remove('bars-hidden');
  resetBarsTimer();
}

function resetBarsTimer(){
  clearTimeout(barsTimeout);
  if(barsActive)barsTimeout=setTimeout(hideBars,10000);
}

function hideBars(){
  if(document.getElementById('browse').classList.contains('open'))return;
  if(mobileFs)return;
  document.body.classList.add('bars-hidden');
}

function startBarsAutoHide(){
  barsActive=true;
  resetBarsTimer();
}

document.querySelector('.controls').addEventListener('click',resetBarsTimer);
document.querySelector('header').addEventListener('click',resetBarsTimer);
</script>
